<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111111">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="manifest" href="manifest.json">
<title>百日繪</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
.wrap{max-width:1100px;margin:auto;padding:16px}.head{display:flex;justify-content:space-between;align-items:end}
h1{margin:0;font-size:28px}.sub{color:#999;margin:4px 0 16px}
.card{background:#1b1b1b;border:1px solid #333;border-radius:18px;padding:16px;margin:12px 0}
.row{display:flex;gap:9px;flex-wrap:wrap}input,select,button{font:inherit;border-radius:11px;border:1px solid #444;padding:12px;background:#252525;color:#fff}
input{flex:1;min-width:220px}button{cursor:pointer}.primary{background:#fff;color:#111;border-color:#fff;font-weight:700}
#playerBox{aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;position:relative}#player{width:100%;height:100%}
.grid9{position:absolute;inset:0;display:none;pointer-events:none;z-index:4}
.grid9.show{display:block}.compOverlay{position:absolute;inset:0;display:none;pointer-events:none;z-index:5}.compOverlay.show{display:block}.compOverlay.thirds:before{content:"";position:absolute;inset:0;background:linear-gradient(to right,transparent 33%,rgba(255,210,80,.9) 33.1%,rgba(255,210,80,.9) 33.25%,transparent 33.35%,transparent 66.65%,rgba(255,210,80,.9) 66.75%,rgba(255,210,80,.9) 66.9%,transparent 67%),linear-gradient(to bottom,transparent 33%,rgba(255,210,80,.9) 33.1%,rgba(255,210,80,.9) 33.25%,transparent 33.35%,transparent 66.65%,rgba(255,210,80,.9) 66.75%,rgba(255,210,80,.9) 66.9%,transparent 67%)}.compOverlay.center:before,.compOverlay.center:after{content:"";position:absolute;background:rgba(255,255,255,.85)}.compOverlay.center:before{left:0;right:0;top:50%;height:2px}.compOverlay.center:after{top:0;bottom:0;left:50%;width:2px}.compOverlay.diagonal:before{content:"";position:absolute;inset:0;background:linear-gradient(33deg,transparent 49.7%,rgba(120,200,255,.9) 50%,transparent 50.3%),linear-gradient(-33deg,transparent 49.7%,rgba(120,200,255,.9) 50%,transparent 50.3%)}.compOverlay.gold:before{content:"";position:absolute;inset:10% 18%;border:2px solid rgba(255,190,70,.85);border-radius:50%;transform:rotate(-12deg)}
.grid9:before,.grid9:after{content:"";position:absolute;inset:0}
.grid9:before{background:linear-gradient(to right,transparent 33.05%,rgba(255,255,255,.72) 33.2%,rgba(255,255,255,.72) 33.35%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.72) 66.65%,rgba(255,255,255,.72) 66.8%,transparent 66.95%)}
.grid9:after{background:linear-gradient(to bottom,transparent 33.05%,rgba(255,255,255,.72) 33.2%,rgba(255,255,255,.72) 33.35%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.72) 66.65%,rgba(255,255,255,.72) 66.8%,transparent 66.95%)}
.lockLayer{position:fixed;inset:0;background:rgba(0,0,0,.08);z-index:9999;display:none;pointer-events:none}
body.locked .lockLayer{display:block}
.unlock{position:absolute;top:16px;right:16px;pointer-events:auto;background:rgba(20,20,20,.9);border:1px solid #777;color:#fff;border-radius:12px;padding:11px 14px;font-weight:700}
body.locked .wrap{user-select:none}
.history button{display:block;width:100%;text-align:left;margin:4px 0;padding:9px 10px;background:#222;border:1px solid #333;color:#ddd;border-radius:10px}
.history button.currentDay{border-color:#888;color:#fff}
.grid{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.time{font-size:20px;font-variant-numeric:tabular-nums}.timer{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;margin-top:12px;padding:10px 12px;background:#151515;border:1px solid #333;border-radius:12px}.timerDisplay{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;min-width:72px;text-align:center}.timerProgress{height:7px;background:#333;border-radius:99px;overflow:hidden}.timerProgress i{display:block;height:100%;width:0;background:#eee;transition:width .3s linear}.timerBtns{display:flex;gap:6px}.timerBtns button{padding:8px 10px}
#status{color:#aaa;margin-top:10px;white-space:pre-wrap}.ok{color:#9be6a8}.bad{color:#ff9b9b}
.history{max-height:180px;overflow:auto;color:#aaa;font-size:14px;line-height:1.8}.tip{color:#bbb;line-height:1.6}
.install{display:none;background:#eee;color:#111;border:0}.install.show{display:inline-block}
@media(max-width:650px){.wrap{padding:10px}h1{font-size:23px}.grid{grid-template-columns:1fr}.card{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
<div class="head"><div><h1>百日繪</h1><div class="sub">電影・電視劇角色隨機取景器</div></div><div id="day"></div></div>
<div class="card">
<div class="row">
<input id="query" placeholder="例如：哈利波特、日劇、漫威、甄嬛傳、動漫">
<select id="sceneType">
<option value="scene">一般場景</option><option value="drama">劇情片段</option><option value="action">動作場景</option>
<option value="portrait">人物特寫</option><option value="fullbody">全身人物</option><option value="anime">動畫角色</option>
</select>
<button class="primary" id="pick">🎲 隨機取景</button>
<button id="install" class="install">＋ 加到主畫面</button>
</div>
<div style="margin-top:9px"><input id="apiKey" type="password" placeholder="第一次使用：輸入 YouTube Data API v3 Key"></div>
<small>API Key 只儲存在本機瀏覽器。</small>
</div>
<div class="card">
<div id="playerBox"><div id="player"></div><div id="grid9" class="grid9" aria-hidden="true"></div><div id="compOverlay" class="compOverlay" aria-hidden="true"></div></div>
<div class="grid"><div><b id="title">尚未抽取</b><div><small id="meta"></small></div></div><div class="time" id="time">--:--</div></div>
<div id="status">輸入題材後按「隨機取景」。</div>
<div class="row" style="margin-top:10px"><button id="again">↻ 再抽一次</button><button id="gridBtn">▦ 九宮格</button><button id="compBtn">📐 構圖模式</button><button id="lockBtn">🔒 鎖定畫面</button><button id="open">↗ YouTube</button></div><div class="timer"><select id="timerPreset"><option value="300">5 分鐘</option><option value="900" selected>15 分鐘</option><option value="1800">30 分鐘</option><option value="3600">60 分鐘</option></select><div><div class="timerDisplay" id="timerDisplay">15:00</div><div class="timerProgress"><i id="timerProgress"></i></div></div><div class="timerBtns"><button id="timerStart">▶ 開始</button><button id="timerReset">↺ 重設</button></div></div>
</div>
<div class="card"><b>📐 構圖模式</b><div class="tip">三分法、中心十字、對角線、黃金構圖。</div><div class="row" style="margin-top:9px"><select id="compType"><option value="thirds">三分法</option><option value="center">中心十字</option><option value="diagonal">對角線</option><option value="gold">黃金構圖</option></select><button id="compApply">顯示構圖線</button></div></div><div class="card"><b>🎨 今日畫法</b><div class="tip">先抓人物動作、構圖與光影，再處理臉部與服裝。抽到不適合的鏡頭就按「再抽一次」。</div></div>
<div class="card"><b>📅 100 日紀錄</b><div id="history" class="history">尚無紀錄</div></div>
</div>
<div class="lockLayer" id="lockLayer"><button class="unlock" id="unlockBtn">🔓 解鎖畫面</button></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player=null,ready=false,current=null,lastUrl='';
const $=x=>document.getElementById(x);
function fmt(n){n=Math.max(0,Math.floor(n||0));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]) )}
function status(s,c){$('status').textContent=s;$('status').className=c||''}
function history(){
let h=getHistory(),today=new Date().toLocaleDateString('zh-TW');
$('history').innerHTML=h.length?h.slice().reverse().map(function(x,i){
let dayNo=h.length-i,can=!!x.id;
return '<button class="'+(x.d===today?'currentDay':'')+'" '+(can?'onclick="loadDay('+dayNo+')"':'')+'>'+dayNo+'. '+esc(x.d)+'｜'+esc(x.t)+'｜'+fmt(x.s)+(can?'':'｜舊紀錄需重新抽取')+'</button>';
}).join(''):'尚無紀錄';
$('day').textContent='第 '+Math.min(h.length+1,100)+' / 100 天';
}
function loadDay(dayNo){
let h=getHistory(),idx=h.length-dayNo;
if(idx<0)return;
let x=h[idx];
if(!x||!x.id){status('這筆是舊版紀錄，沒有保存影片 ID；請重新抽取後才可回到該圖。','bad');return}
current={id:x.id,title:x.t||'',time:x.s||0,duration:x.duration||0};
lastUrl='https://www.youtube.com/watch?v='+x.id+'&t='+x.s+'s';
$('title').textContent=current.title;
$('meta').textContent=(x.query||('第 '+dayNo+' 天'))+'｜影片長度 '+fmt(current.duration);
$('time').textContent=fmt(current.time);
if(x.query)$('query').value=x.query;
if(x.scene)$('sceneType').value=x.scene;
load();
status('已回到第 '+dayNo+' 天的取景。按「🔒 鎖定畫面」即可開始畫。','ok');
}
function saveToday(x){
let h=getHistory(),d=new Date().toLocaleDateString('zh-TW');
let item={d:d,t:x.title,s:x.time,id:x.id,duration:x.duration,query:$('query').value.trim(),scene:$('sceneType').value};
let i=h.findIndex(function(v){return v.d===d});
if(i>=0)h[i]=item;else h.push(item);
localStorage.setItem('brh',JSON.stringify(h.slice(-100)));history();
}
function loadToday(){
let d=new Date().toLocaleDateString('zh-TW'),h=getHistory(),x=h.find(function(v){return v.d===d});
if(!x||!x.id)return;
current={id:x.id,title:x.t||'',time:x.s||0,duration:x.duration||0};
lastUrl='https://www.youtube.com/watch?v='+x.id+'&t='+x.s+'s';
$('title').textContent=current.title;
$('meta').textContent=(x.query||'今日題目')+'｜影片長度 '+fmt(current.duration);
$('time').textContent=fmt(current.time);
if(x.query)$('query').value=x.query;
if(x.scene)$('sceneType').value=x.scene;
load();
status('今天已抽取過，繼續使用今天這個場景即可。','ok');
}
let wakeLock=null;
let timerId=null,timerLeft=900,timerTotal=900;
function renderTimer(){$('timerDisplay').textContent=fmt(timerLeft);$('timerProgress').style.width=((timerTotal-timerLeft)/timerTotal*100)+'%';$('timerStart').textContent=timerId?'⏸ 暫停':'▶ 開始'}
function resetTimer(){clearInterval(timerId);timerId=null;timerTotal=Number($('timerPreset').value);timerLeft=timerTotal;renderTimer()}
function toggleTimer(){if(timerId){clearInterval(timerId);timerId=null;renderTimer();return}timerId=setInterval(()=>{timerLeft--;renderTimer();if(timerLeft<=0){clearInterval(timerId);timerId=null;renderTimer();if(navigator.vibrate)navigator.vibrate([250,120,250]);status('⏰ 時間到！','ok')}},1000)}
$('timerPreset').onchange=resetTimer;$('timerStart').onclick=toggleTimer;$('timerReset').onclick=resetTimer;renderTimer();
async function requestWakeLock(){
try{if('wakeLock' in navigator)wakeLock=await navigator.wakeLock.request('screen')}
catch(e){status('畫面鎖定已開啟，但瀏覽器未允許保持螢幕常亮。','bad')}
}
async function releaseWakeLock(){
try{if(wakeLock){await wakeLock.release();wakeLock=null}}catch(e){}
}
function setLocked(on){
document.body.classList.toggle('locked',on);
if(on){requestWakeLock();status('🔒 畫面已鎖定：可專心作畫。點右上角「解鎖畫面」返回操作。','ok')}
else releaseWakeLock();
}
$('compApply').onclick=function(){let o=$('compOverlay');o.className='compOverlay '+$('compType').value+' show';$('compBtn').textContent='📐 關閉構圖'};$('compBtn').onclick=function(){let o=$('compOverlay');if(o.classList.contains('show')){o.classList.remove('show');$('compBtn').textContent='📐 構圖模式'}else{o.className='compOverlay '+$('compType').value+' show';$('compBtn').textContent='📐 關閉構圖'}};$('gridBtn').onclick=function(){
$('grid9').classList.toggle('show');
$('gridBtn').textContent=$('grid9').classList.contains('show')?'▦ 關閉九宮格':'▦ 九宮格';
};
$('lockBtn').onclick=function(){setLocked(true)};
$('unlockBtn').onclick=function(){setLocked(false)};
document.addEventListener('visibilitychange',function(){
if(document.visibilityState==='visible'&&document.body.classList.contains('locked'))requestWakeLock();
});
let ytApiReady=false;

function onYouTubeIframeAPIReady(){
  ytApiReady=true;
  makePlayer();
  if(current) setTimeout(load,100);
}
window.onYouTubeIframeAPIReady=onYouTubeIframeAPIReady;

function makePlayer(){
  if(player||!window.YT||!YT.Player)return;
  player=new YT.Player('player',{
    width:'100%',
    height:'100%',
    videoId:current?current.id:'',
    playerVars:{playsinline:1,origin:location.origin,rel:0},
    events:{
      onReady:function(){ready=true;if(current)load()},
      onError:function(e){
        let msg='影片無法嵌入';
        if(e.data===101||e.data===150)msg='這部影片禁止嵌入，請再抽一次。';
        else if(e.data===100)msg='這部影片已不存在或設為私人，請再抽一次。';
        else if(e.data===153)msg='YouTube 嵌入驗證失敗，請重新整理頁面後再試。';
        status(msg,'bad');
      }
    }
  });
}

function load(){
  if(!current)return;
  if(!player||!ready){
    status('取景完成，正在載入播放器……','ok');
    if(window.YT&&YT.Player)makePlayer();
    return;
  }
  try{
    player.loadVideoById({videoId:current.id,startSeconds:current.time||0});
    status('已抽到今天的場景！','ok');
  }catch(e){
    status('播放器載入失敗，請重新整理頁面後再試。','bad');
  }
}

function getHistory(){
  try{
    let h=JSON.parse(localStorage.getItem('brh')||'[]');
    if(!Array.isArray(h))return[];
    let map={};
    h.forEach(function(x){if(x&&x.d)map[x.d]=x});
    return Object.keys(map).sort(function(a,b){return new Date(a)-new Date(b)}).map(function(k){return map[k]}).slice(-100);
  }catch(e){return[]}
}

async function pick(){
  let key=$('apiKey').value.trim();
  if(!key){
    status('請先輸入 YouTube Data API v3 Key。','bad');
    $('apiKey').focus();
    return;
  }
  localStorage.setItem('ytk',key);
  let q=$('query').value.trim();
  if(!q){
    status('請先輸入想畫的題材，例如：哈利波特、日劇、漫威。','bad');
    $('query').focus();
    return;
  }
  let today=new Date().toLocaleDateString('zh-TW');
  let todayRecord=getHistory().find(function(x){return x.d===today});
  if(todayRecord&&todayRecord.id){
    status('今天已經抽過題目了；明天再抽新題。','bad');
    return;
  }

  let type=$('sceneType').value;
  let suffix={
    scene:'',
    drama:' 劇情片段',
    action:' 動作場景',
    portrait:' 人物特寫',
    fullbody:' 全身人物',
    anime:' 動畫角色'
  }[type]||'';
  let searchQ=q+suffix;

  status('正在搜尋 YouTube……','ok');
  try{
    let searchUrl='https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&safeSearch=moderate&maxResults=20&q='+encodeURIComponent(searchQ)+'&key='+encodeURIComponent(key);
    let sr=await fetch(searchUrl);
    let sj=await sr.json();
    if(!sr.ok)throw new Error(sj.error&&sj.error.message?sj.error.message:'YouTube 搜尋失敗');
    let ids=(sj.items||[]).map(function(x){return x.id&&x.id.videoId}).filter(Boolean);
    if(!ids.length){status('找不到符合條件的 YouTube 影片，請換一個題材。','bad');return}

    let vr=await fetch('https://www.googleapis.com/youtube/v3/videos?part=contentDetails,snippet&id='+ids.map(encodeURIComponent).join(',')+'&key='+encodeURIComponent(key));
    let vj=await vr.json();
    if(!vr.ok)throw new Error(vj.error&&vj.error.message?vj.error.message:'影片資料取得失敗');

    let candidates=(vj.items||[]).map(function(v){
      let m=(v.contentDetails.duration||'').match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
      let sec=(m?((Number(m[1]||0)*3600)+(Number(m[2]||0)*60)+Number(m[3]||0)):0);
      return {id:v.id,title:v.snippet&&v.snippet.title||'',duration:sec};
    }).filter(function(v){return v.duration>=30});

    if(!candidates.length){status('找到的影片都太短，請換題材再試。','bad');return}

    let x=candidates[Math.floor(Math.random()*candidates.length)];
    let min=Math.max(5,Math.floor(x.duration*0.12));
    let max=Math.max(min,Math.floor(x.duration*0.88));
    x.time=min+Math.floor(Math.random()*(max-min+1));
    x.query=q;x.scene=type;
    current=x;
    lastUrl='https://www.youtube.com/watch?v='+x.id+'&t='+x.time+'s';
    $('title').textContent=x.title;
    $('meta').textContent=q+'｜影片長度 '+fmt(x.duration);
    $('time').textContent=fmt(x.time);
    saveToday(x);
    status('已抽到今天的場景！正在載入影片……','ok');
    load();
  }catch(e){
    console.error(e);
    status('隨機抽取失敗：'+(e.message||'未知錯誤')+'\n請確認 API Key 有啟用 YouTube Data API v3。','bad');
  }
}

$('pick').onclick=pick;
$('again').onclick=function(){
let today=new Date().toLocaleDateString('zh-TW');
let todayRecord=getHistory().find(function(x){return x.d===today});
if(todayRecord&&todayRecord.id){
status('今天已經有題目了；明天再抽新題。若要回看其他天，請點選「100 日紀錄」。','bad');
return;
}
pick();
};
$('open').onclick=function(){if(lastUrl)location.href=lastUrl};
$('apiKey').value=localStorage.getItem('ytk')||'';
history();
loadToday();
let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('install').classList.add('show')});
$('install').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;$('install').classList.remove('show')}else alert('請使用 Chrome 選單 →「新增至主畫面」或「安裝應用程式」。')};
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
